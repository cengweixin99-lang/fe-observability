services:
  postgres:
    image: postgres:17
    container_name: fe-observability-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: observability_dev
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability -d observability_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: